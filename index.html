<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Ssambap Korean BBQ — authentic Korean cuisine and tabletop barbecue in Stony Brook, New York."
    />

    <title>Ssambap Korean BBQ | Stony Brook, NY</title>
  </head>

  <body>
    <div id="root"></div>

    <!--
      Static Netlify form blueprint.

      Netlify scans the generated HTML during deployment.
      The visible contact form is rendered by React, so this
      static form allows Netlify to discover the "contact" form.
    -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input
        type="hidden"
        name="form-name"
        value="contact"
      />

      <p>
        <label>
          Don't fill this out if you're human:
          <input
            name="bot-field"
            type="text"
          />
        </label>
      </p>

      <p>
        <label>
          Name
          <input
            type="text"
            name="name"
          />
        </label>
      </p>

      <p>
        <label>
          Email
          <input
            type="email"
            name="email"
          />
        </label>
      </p>

      <p>
        <label>
          Phone
          <input
            type="tel"
            name="phone"
          />
        </label>
      </p>

      <p>
        <label>
          Message
          <textarea name="message"></textarea>
        </label>
      </p>

      <button type="submit">
        Submit
      </button>
    </form>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
