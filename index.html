<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Ssambap Korean BBQ — authentic Korean cuisine and tabletop barbecue in Stony Brook, New York."
    />

    <title>Ssambap Korean BBQ | Stony Brook, NY</title>
  </head>

  <body>
    <div id="root"></div>

    <!--
      Hidden form for Netlify Forms detection.

      Netlify scans the generated HTML during deployment.
      Since our real contact form is rendered by React,
      this static copy allows Netlify to detect the form.
    -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />

      <input name="bot-field" />

      <input type="text" name="name" />

      <input type="email" name="email" />

      <input type="tel" name="phone" />

      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
